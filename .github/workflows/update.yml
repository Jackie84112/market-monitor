name: 更新資料

on:
  schedule:
    # GitHub 排程實測常延遲 3–5 小時，無法準點，所以平日每小時排一次，盡量縮短資料落差
    - cron: "17 * * * 1-5"
    # 週六補美股週五收盤後才出的 Cboe、FRED 資料
    - cron: "17 1,5 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pipeline/build.py
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "資料無變動"
          else
            git commit -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
