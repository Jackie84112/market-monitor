<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU ASIC 晶片專題監控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 色票與卡片沿用大盤監控（index.html），之後併回宏觀網站較省事；紅漲綠跌 */
  :root{--bg:#F6F5F2;--card:#FFFFFF;--ink:#22262B;--muted:#6B7178;--line:#E4E2DC;--accent:#B04A2F;
    --up:#DC2626;--dn:#15803D;--chart:#2563EB;--soft:#FAF9F6;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;margin:0;padding:0 16px 40px;font-size:14px;}
  .wrap{max-width:1180px;margin:20px auto 0;display:flex;flex-direction:column;gap:14px;}
  header{padding:4px 4px 0;}
  .nav a{color:var(--accent);text-decoration:none;font-size:13px;}
  .nav a:hover{text-decoration:underline;}
  h1{font-size:28px;margin:6px 0 0;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;}
  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .head h2{font-size:23px;font-weight:700;margin:0;letter-spacing:.5px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.15;}
  .head span{color:var(--muted);font-size:13.5px;}
  @media (max-width:640px){.head h2{font-size:20px;} .head span{font-size:12.5px;}}
  table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;}
  th{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.5px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:var(--soft);}
  .n{text-align:right;white-space:nowrap;} th.n{text-align:right;}
  .up{color:var(--up);} .dn{color:var(--dn);} .mu{color:var(--muted);}
  .tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:5px;background:#FBF1DD;color:#92600F;margin-left:6px;}
  small{font-size:12px;color:var(--muted);}
  .chip{display:inline-block;font-size:12px;line-height:1.6;padding:0 8px;border-radius:5px;background:#EFEEEA;color:#4B5158;white-space:nowrap;}
  .chip.g{background:#E7F3EB;color:#15803D;} .chip.r{background:#FBEAEA;color:#C02323;}
  .st{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .notes{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.6;}
  .notes p{margin:2px 0;}
  .warn{color:#C02323;}
  svg{display:block;touch-action:pan-y;} svg text{font-family:inherit;font-variant-numeric:tabular-nums;}
  #tip{position:fixed;pointer-events:none;background:rgba(34,38,43,.94);color:#F2F1EE;border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.5;display:none;z-index:9;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .rt{position:relative;width:100%;height:10px;background:#EFEEEA;border-radius:5px;display:block;}
  .rt i{position:absolute;left:0;top:0;bottom:0;background:var(--chart);border-radius:5px;}
  .rt b{position:absolute;top:-3px;bottom:-3px;width:1px;background:#8C9096;}
  .rtl{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:3px;}
  .rtl span{position:absolute;transform:translateX(-50%);white-space:nowrap;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft);min-width:0;}
  .kpi .l{font-size:12px;color:var(--muted);}
  .kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.25;}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;}
  .kpi.wide{grid-column:span 2;}
  @media (max-width:520px){.kpi.wide{grid-column:span 1;}}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:8px 0 0;}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scroll table{min-width:440px;}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
  .two>div{min-width:0;}
  @media (max-width:900px){.two{grid-template-columns:minmax(0,1fr);}}
  h3{font-size:15px;font-weight:700;margin:16px 0 6px;}
  h3:first-child{margin-top:0;}
  tr.curp td{background:#FBF1DD;font-weight:600;}
  tr.cur td{background:#FFF8EA;}
  .vb{display:grid;grid-template-columns:92px 1fr 96px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0;font-variant-numeric:tabular-nums;}
  .vb .t{height:10px;background:#EFEEEA;border-radius:5px;position:relative;}
  .vb .t i{position:absolute;left:0;top:0;bottom:0;background:var(--chart);opacity:.7;border-radius:5px;}
  .vb.cur .t i{background:var(--accent);opacity:1;}
  .vb.cur{font-weight:600;}
  .vb .r{text-align:right;}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;}
  .seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--ink);padding:5px 16px;cursor:pointer;}
  .seg button.on{background:var(--ink);color:#fff;}
  /* 指數位置（2026-11-20 自大盤監控首頁搬來）：樣式限定在 #ipos，避免與下方 ETF 卡片的 .rt 等衝突 */
  /* 每檔 ETF 識別色（2026-11-20）：卡片頂端色帶＋標題色條，指數位置對應列加同色小點；避開紅綠（站內代表漲跌） */
  section.etf{border-top:4px solid var(--ec);}
  section.etf .head h2{border-left-color:var(--ec);}
  /* 標題列色塊（2026-11-20）：淡識別色底、左大代碼、右最新價＋當日漲跌（紅漲綠跌） */
  section.etf .ehead{margin:-14px -16px 14px;padding:12px 16px;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;
    background:color-mix(in srgb,var(--ec) 9%,#fff);align-items:center;flex-wrap:nowrap;gap:16px;}
  .ehead .ecode{font-size:30px;font-weight:700;color:var(--ec);letter-spacing:.5px;line-height:1;white-space:nowrap;}
  .ehead .etit{min-width:0;flex:1;}
  .ehead .etit h2{border-left:0;padding-left:0;font-size:18px;}
  .ehead .etit span{display:block;margin-top:2px;font-size:12.5px;}
  .ehead .epx{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .ehead .epx b{display:block;font-size:26px;line-height:1.1;}
  .ehead .epx em{font-style:normal;font-size:15px;font-weight:700;margin-right:6px;}
  @media (max-width:640px){section.etf .ehead{flex-wrap:wrap;gap:6px 12px;} .ehead .ecode{font-size:24px;} .ehead .etit{order:3;flex-basis:100%;} .ehead .epx{margin-left:auto;} .ehead .epx b{font-size:22px;}}
  /* 卡片間分隔（2026-11-20）：加大間距＋一條灰色間隔線（使用者不要「2 / 4 代碼」文字） */
  .esep{height:1px;background:#CFCCC4;margin:18px 0 4px;}
  .ed{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;position:relative;top:-1px;}
  #ipos .name small{display:block;line-height:1.35;margin-top:1px;}
  #ipos .rt{position:relative;width:130px;height:8px;background:#EFEEEA;border-radius:4px;display:inline-block;vertical-align:middle;}
  #ipos .rt i{position:absolute;left:0;top:0;bottom:0;background:var(--chart);border-radius:4px;}
  #ipos .rt b{position:absolute;top:-2px;bottom:-2px;width:1px;background:#8C9096;}
  #ipos .rtv{display:inline-block;width:46px;text-align:right;}
  #ipos .multi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  #ipos .mc{min-width:0;border-top:1px solid var(--line);padding-top:10px;}
  #ipos .mc h3{font-size:13.5px;font-weight:500;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;}
  #ipos .plot{position:relative;width:100%;}
  #ipos tr.tg{cursor:pointer;}
  #ipos tr.tg .name::before{content:"▸";display:inline-block;width:14px;color:var(--muted);font-size:11px;}
  #ipos tr.tg.open .name::before{content:"▾";}
  #ipos tr.tg .name small{padding-left:14px;}
  #ipos tr.detail{display:none;}
  #ipos tr.detail.open{display:table-row;}
  #ipos tr.detail:hover{background:none;}
  #ipos tr.detail>td{background:var(--soft);padding:10px 14px 12px;}
  #ipos .dt-t{font-size:12px;color:var(--muted);margin-bottom:6px;}
  @media (max-width:900px){#ipos .multi{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){
    #ipos .multi{grid-template-columns:1fr;}
    #ipos table.cards thead{display:none;}
    #ipos table.cards tr{display:block;padding:9px 0;border-bottom:1px solid var(--line);}
    #ipos table.cards tbody tr:last-child{border-bottom:0;}
    #ipos table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:2px 0;text-align:right;}
    #ipos table.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;white-space:nowrap;}
    #ipos table.cards td.name{display:block;text-align:left;font-weight:500;}
    #ipos table.cards td.name::before{content:none;}
    #ipos table.cards td.name small{font-weight:400;}
    #ipos .rt{width:96px;}
    #ipos table.cards tr.detail{display:none;padding:0;border:0;}
    #ipos table.cards tr.detail.open{display:block;}
    #ipos table.cards tr.detail>td{display:block;text-align:left;padding:8px 8px 10px;}
    #ipos table.cards tr.detail>td::before{content:none;}
    #ipos table.cards tr.tg td.name::before{content:"▸";}
    #ipos table.cards tr.tg.open td.name::before{content:"▾";}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="nav"><a href="./">← 大盤監控</a></div>
    <h1>GPU ASIC 晶片專題監控</h1>
    <p class="sub" id="sub">讀取中…</p>
    <div class="st" id="st"></div>
  </header>
  <div id="cards" style="display:contents"></div>
</div>
<div id="tip"></div>
<script src="retrace.js?v=20261123p"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const short = d => d ? d.slice(5).replace("-", "/") : "—";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const KEYS = ["nvda", "amd_r", "avgo", "mediatek", "guc", "alchip"];   // 順序：英偉達、AMD、博通、聯發科、創意、世芯（2026-11-23 使用者定）
// 識別色（避開紅綠）：英偉達紫、AMD 橘、博通藍、聯發科青、創意琥珀、世芯石板灰
const EC = ["#7C3AED", "#C2410C", "#2563EB", "#0891B2", "#A16207", "#475569"];
const dot = c => c ? `<i class="ed" style="background:${c}"></i>` : "";
let DATA = [], SCN = {};
// 情境模擬（同 AMD 頁）：data/chip_scenario.json 依資料檔名放各公司的三條示意路徑；有設定的公司才出現開關，預設關
const SON = {};
const scenOf = i => { const C = SCN[KEYS[i]]; return C && SON[i] ? C.scenarios.map(s => ({color: s.color, tag: s.tag, text: s.text, label: s.legend, band: s.band,
  pts: [[C.anchorDate, C.anchor], ...s.path.map((v, k) => [C.days[k], v])]})) : []; };
const dd = i => ({...DATA[i], scen: scenOf(i)});
const redraw = i => drawRetrace($("rc" + i), dd(i), $("rl" + i));
function draw() { DATA.forEach((d, i) => redraw(i)); }
const SC_SEG = i => { const C = SCN[KEYS[i]]; return C ? `<div class="ctl"><span style="font-size:13px;color:var(--muted)">情境模擬</span><div class="seg" data-sc="${i}"><button type="button" aria-pressed="false">${C.short || "模擬"}（${short(C.anchorDate)} 起）</button></div></div>` : ""; };
Promise.all([...KEYS.map(k => fetch("data/" + k + ".json", {cache: "no-store"}).then(r => r.json())),
  fetch("data/chip_scenario.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({}))]).then(all => {
  const arr = all.slice(0, KEYS.length); SCN = all[KEYS.length] || {};
  DATA = arr;
  $("cards").innerHTML = arr.map((d, i) => {
    const sw = d.swing;
    const lp = (sw.path && sw.path.length) ? sw.path[sw.path.length - 1] : [sw.low.date, sw.low.v, null, sw.lowChg];   // [日期, 收盤, 量, 當日%]
    const ch = lp[3], cc = ch > 0 ? "up" : ch < 0 ? "dn" : "mu";
    return `<div class="esep"></div><section class="card etf" style="--ec:${EC[i]}"><div class="head ehead"><div class="ecode">${esc(d.code)}</div>
      <div class="etit"><h2>${esc(d.name)}</h2><span>${short(sw.high.date)} 收盤高點至 ${short(sw.low.date)} 收盤低點；以收盤低點為原點，之後每日收盤</span></div>
      <div class="epx"><b>${fmt(lp[1], d.dec ?? 2)}</b><em class="${cc}">${ch == null ? "—" : (ch > 0 ? "+" : "") + fmt(ch, 2) + "%"}</em><small>${short(lp[0])}${d.live ? " 盤中" : " 收盤"}</small></div></div>
      ${VP_SEG("rc" + i).replace(/<\/div>$/, MA_SEG("rc" + i, d.code) + SC_SEG(i) + MEAS_SEG("rc" + i) + WIN_SEG("rc" + i) + "</div>")}
      <div id="rc${i}" style="width:100%"></div><div class="legend" id="rl${i}"></div></section>`;
  }).join("");
  const asof = arr.map(d => d.asof).sort().pop();
  $("sub").textContent = `英偉達、AMD、博通、聯發科、創意、世芯　｜　最新資料日：${asof.replace(/-/g, "/")}　｜　資料更新：${arr[0].updated}（台灣時間）`;
  $("st").innerHTML = arr.map(d => { const s = d.status.Yahoo;
    return `<span class="chip ${s.ok ? "" : "r"}" title="${s.err ? esc(s.err) : ""}">${esc(d.code)} ${s.ok ? "至" : "抓取失敗，沿用至"} ${short(s.asof)}</span>`; }).join("");
  bindVpSeg(id => redraw(+id.slice(2)));
  bindWinSeg(id => redraw(+id.slice(2)));
  bindMaSeg(id => redraw(+id.slice(2)));
  document.querySelectorAll(".seg[data-sc]").forEach(seg => seg.onclick = () => { const i = +seg.dataset.sc, b = seg.querySelector("button");
    SON[i] = !SON[i]; b.classList.toggle("on", SON[i]); b.setAttribute("aria-pressed", SON[i]); redraw(i); });
  draw();
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 150); });
}).catch(e => { $("sub").innerHTML = `<span style="color:#C02323">資料讀取失敗：${e}</span>`; console.error(e); });

</script>
</body>
</html>
